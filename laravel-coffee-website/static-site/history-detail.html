<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Transaksi | Seteguk Kopi</title>
  <link rel="icon" type="image/png" href="/images/logo1.png" />
  <link rel="manifest" href="/manifest.json" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script type="module" src="/src/js/main.js"></script>
</head>
<body class="bg-[#ececec] min-h-screen">
  <div id="nav-mount"></div>

  <main class="pt-[80px] flex justify-center" x-data="{
      get transaksi() { return $store.history.findById(qs('id')); }
    }" x-init="mountNavUser()">
    <div class="sm:w-[800px] w-full px-4 pb-10">
      <a :href="asset('history.html')" class="text-xs text-secondary underline">← Kembali</a>

      <template x-if="!transaksi">
        <p class="text-gray-500 text-center py-12">Transaksi tidak ditemukan.</p>
      </template>

      <template x-if="transaksi">
        <div class="bg-white rounded-lg p-4 mt-3 shadow">
          <h1 class="text-lg font-semibold">Detail Transaksi</h1>
          <p class="text-xs text-gray-500" x-text="'No. ' + transaksi.id"></p>
          <p class="text-xs" x-text="formatTanggal(transaksi.created_at)"></p>
          <p class="text-xs mt-2">
            Metode: <strong x-text="transaksi.delivery === 'yes' ? 'Delivery' : 'Takeaway'"></strong>
            · Pembayaran: <strong x-text="transaksi.payment_jenis || '-'"></strong>
          </p>
          <p class="text-xs">Status:
            <span class="px-2 py-0.5 rounded-full text-[10px]"
              :class="transaksi.order_telah_diantar === 'Sudah diantar' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'"
              x-text="transaksi.order_telah_diantar"></span>
          </p>

          <template x-if="transaksi.alamat_snapshot">
            <div class="text-xs mt-3 p-2 bg-slate-50 rounded">
              <p class="font-semibold" x-text="transaksi.alamat_snapshot.kel + ', ' + transaksi.alamat_snapshot.kec"></p>
              <p x-text="transaksi.alamat_snapshot.detail"></p>
            </div>
          </template>

          <p class="font-semibold mt-4 mb-1 text-sm">Item</p>
          <template x-for="item in transaksi.items" :key="item.kopi_id + (item.jenis || '')">
            <div class="border-b py-2 text-xs flex justify-between">
              <div>
                <p class="font-semibold" x-text="item.kopi_nama"></p>
                <p x-show="item.jenis" class="text-secondary" x-text="'Jenis - ' + item.jenis"></p>
                <p x-text="item.qty + ' × ' + formatRupiah(item.harga)"></p>
              </div>
              <p class="font-semibold" x-text="formatRupiah(item.subtotal)"></p>
            </div>
          </template>

          <div class="mt-3 flex justify-between text-xs">
            <span>Ongkir</span><span x-text="formatRupiah(transaksi.ongkir || 0)"></span>
          </div>
          <div class="flex justify-between text-sm font-semibold mt-1">
            <span>Total</span><span x-text="formatRupiah(transaksi.total_price)"></span>
          </div>

          <template x-if="transaksi.bukti_payment">
            <div class="mt-4">
              <p class="text-xs font-semibold mb-1">Bukti Pembayaran</p>
              <img :src="transaksi.bukti_payment" alt="bukti" class="max-w-[250px] rounded border">
            </div>
          </template>
        </div>
      </template>
    </div>
  </main>
</body>
</html>
