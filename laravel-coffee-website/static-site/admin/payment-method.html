<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Method | Admin</title>
  <link rel="icon" type="image/png" href="/images/logo_icon_black.png" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script type="module" src="/src/js/main.js"></script>
</head>
<body class="bg-[#f3f3f3] min-h-screen">
  <div id="sidebar-mount"></div>
  <main class="ml-[220px] p-6" x-data x-init="mountSidebarAdmin()">
    <h1 class="text-2xl font-bold mb-4">Metode Pembayaran</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <template x-for="p in $store.data.paymentMethods" :key="p.id">
        <div class="bg-white rounded-lg shadow p-4">
          <p class="font-semibold" x-text="p.nama"></p>
          <p class="text-xs text-gray-500" x-text="p.jenis"></p>
          <p class="text-sm mt-1" x-text="'a.n. ' + p.atas_nama"></p>
          <p class="text-sm" x-show="p.nomor" x-text="p.nomor"></p>
          <img x-show="p.foto" :src="asset('images/' + p.foto)" class="max-w-[180px] mt-2 rounded">
        </div>
      </template>
    </div>
  </main>
</body>
</html>
