<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Kopi | Admin</title>
  <link rel="icon" type="image/png" href="/images/logo_icon_black.png" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script type="module" src="/src/js/main.js"></script>
</head>
<body class="bg-[#f3f3f3] min-h-screen">
  <div id="sidebar-mount"></div>
  <main class="ml-[220px] p-6" x-data x-init="mountSidebarAdmin()">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Menu Kopi</h1>
      <button class="btn-primary" @click="alert('Mode static: CRUD tidak tersedia tanpa server')">+ Tambah Kopi</button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-primary text-left">
          <tr>
            <th class="p-2">Foto</th>
            <th class="p-2">Nama</th>
            <th class="p-2">Harga</th>
            <th class="p-2">Diskon</th>
            <th class="p-2">Stok</th>
            <th class="p-2">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="k in $store.data.kopi" :key="k.id">
            <tr class="border-t">
              <td class="p-2"><img :src="asset('images/' + k.foto)" class="w-12 h-12 object-cover rounded" /></td>
              <td class="p-2" x-text="k.jenis_kopi"></td>
              <td class="p-2" x-text="formatRupiah(k.harga)"></td>
              <td class="p-2" x-text="k.diskon ? k.diskon + '%' : '-'"></td>
              <td class="p-2" :class="k.stok < 1 ? 'text-red-500 font-semibold' : ''" x-text="k.stok"></td>
              <td class="p-2">
                <button class="text-xs text-secondary underline" @click="alert('Mode read-only')">Edit</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
